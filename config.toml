# ─────────────────────────────────────────────────────────────────────────────
#  ModaRadar · configuración
#  Edita este archivo (también desde la app de GitHub en el móvil) para añadir
#  tiendas, cambiar los descuentos que te avisan o poner tus tallas.
# ─────────────────────────────────────────────────────────────────────────────

[general]
region = "ES"
currency = "EUR"
data_dir = "docs/data"             # la app (GitHub Pages) lee de aquí
user_agent = "ModaRadar/1.0 (monitor personal de rebajas de moda)"
request_delay_seconds = 2.0        # pausa mínima entre peticiones al mismo dominio
respect_robots_txt = true          # nunca se desactiva para webs de tiendas
min_store_pct = 20                 # solo se guardan prendas rebajadas al menos un 20 % (lo demás no es outlet)
forget_after_days = 7              # prendas que ya no aparecen (agotadas o sin rebaja) se borran a los N días
parallel_stores = 6                # tiendas consultadas a la vez (cada una con su pausa propia)
blocked_pause_hours = 12           # si una tienda bloquea el acceso: pausa de 1 h, 2 h, 4 h… hasta N horas
ratelimit_pause_hours = 3          # si pide bajar el ritmo (HTTP 429): pausa de 1 h, 2 h… hasta N horas

[filters]
# Palabras que descartan un producto en todas las tiendas (sin acentos ni mayúsculas).
# Perfumes, velas, tarjetas regalo, ropa de hombre y de niña ya se descartan solos.
exclude = ["tarjeta regalo", "gift card", "muestra gratuita", "packaging"]

[notifications]
min_discount_pct = 40              # avisar de prendas rebajadas al menos un 40 % («mucho más baratas»)
destacadas_min_pct = 30            # en las marcas destacadas (Zara, Brownie, Zadig) basta con un 30 %
chollo_pct = 50                    # 🔥 desde un 50 %: aviso prioritario (suena aunque tengas el móvil en silencio en ntfy)
notify_new = true                  # 🆕 una prenda entra en rebajas/outlet
notify_price_drop_pct = 10         # 💸 una prenda ya rebajada baja otro 10 % o más (0 = no avisar)
notify_restock = true              # 🔁 vuelve a haber stock de una prenda rebajada (o tu talla)
categories = ["ropa"]              # ropa · calzado · bolsos · accesorios
# Tus tallas: solo te avisa si queda alguna (en las tiendas que publican las tallas; Zara no lo hace).
# Ejemplos: ["S", "M"] · ["36", "38"] · ["S", "M", "38"]. Vacío = cualquier talla.
mis_tallas = []
# Palabras que SIEMPRE avisan con prioridad alta (aunque no estén en `categories`)
watchlist = ["cachemir", "cashmere", "abrigo", "gabardina", "trench"]
max_per_run = 6                    # más avisos que esto en una pasada → se agrupan en un resumen
# Canales (se configuran con *secrets* de GitHub, nunca aquí):
#   NTFY_TOPIC (obligatorio para los avisos push) · NTFY_SERVER (opcional, por defecto https://ntfy.sh)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (opcional)

# ─────────────────────────────────────────────────────────────────────────────
#  ⭐ MARCAS DESTACADAS
#  `destacada = true`: pestaña propia en la app, se revisan en cada pasada (cada 15 min)
#  y avisan con prioridad alta desde `destacadas_min_pct`.
# ─────────────────────────────────────────────────────────────────────────────

[[stores]]
id = "zara"
name = "Zara"
short = "Zara"
destacada = true
platform = "zara"                  # catálogo JSON público de su web (secciones de rebajas de MUJER)
url = "https://www.zara.com"
locale = "/es/es"
section = "MUJER"
menu_hours = 6                     # cada cuántas horas mira si ha abierto secciones nuevas (REBAJAS, BLACK FRIDAY…)
categories = [2419724]             # respaldo: «SPECIAL PRICES» de mujer, por si cambia el menú
outlet_url = "https://www.zara.com/es/es/mujer-precios-especiales-l1314.html"
note = "Todo el año tiene «Special prices» de mujer; cuando abre rebajas o Black Friday el radar añade esas secciones solo. Zara no publica las tallas en el listado: compruébalas en su web."

[[stores]]
