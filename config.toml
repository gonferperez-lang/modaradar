max_pages = 8                      # catálogo completo (unos 500 productos): cualquier rebaja se ve
outlet_url = "https://www.browniespain.com/es-es/collections/see-all-sales"
note = "Fuera de temporada casi no tiene rebajas: los avisos llegan en cuanto marca precios rebajados (Black Friday, rebajas de enero y de verano)."

[[stores]]
