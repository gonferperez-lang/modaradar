name: ModaRadar
run-name: "${{ inputs.origen == 'reloj' && 'Reloj · cada 15 min' || (github.event_name == 'schedule' && 'Respaldo de GitHub' || (github.event_name == 'workflow_dispatch' && (inputs.test_notify && 'Aviso de prueba' || 'Revisión manual') || 'Cambios en la app')) }}"

on:
  schedule:
    # RESPALDO. El reloj puntual es reloj.yml (cada 15 min, lanza esto con origen=reloj):
    # el programador gratuito de GitHub se salta o retrasa muchas ejecuciones.
    # Si el reloj acaba de revisar, estas pasadas terminan en segundos sin hacer nada.
    - cron: "7,22,37,52 * * * *"
  push:                       # al cambiar config.toml o la app se ejecuta y publica al momento
    branches: [main]
    paths: ["config.toml", "modaradar/**", "docs/*.html", "docs/*.js", "docs/*.css", "docs/*.webmanifest", "docs/icons/**"]
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      test_notify:
        description: "Enviar solo un aviso de prueba al móvil"
        type: boolean
        default: false
      origen:
        description: "Quién lo lanza (reloj.yml envía «reloj»)"
        type: string
        default: manual

permissions:
  actions: write    # volver a arrancar el reloj (reloj.yml) si se ha parado
  contents: write   # guardar el estado (docs/data) en el repositorio
  pages: write      # publicar la app en GitHub Pages
  id-token: write

concurrency:
  group: modaradar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # se acepta tanto como secret como en la pestaña "Variables"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER || vars.NTFY_SERVER }}
      NTFY_TOPIC_SOURCE: ${{ secrets.NTFY_TOPIC != '' && 'Secrets' || (vars.NTFY_TOPIC != '' && 'Variables' || 'ninguno') }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      MODARADAR_TRIGGER: ${{ inputs.origen == 'reloj' && 'reloj' || github.event_name }}
    steps:
      - name: Mantener el reloj en marcha
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow reloj.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" = "0" ]; then
            gh workflow run reloj.yml --ref "$GITHUB_REF_NAME" && echo "Reloj parado: arrancado de nuevo."
          else
            echo "Reloj en marcha."
          fi

      - uses: actions/checkout@v5
        with:
          # la última versión de la rama, no la del momento del disparo: si esta ejecución
          # esperó en cola a otra, parte de sus datos y no repite avisos ya enviados
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Aviso de prueba
        if: ${{ inputs.test_notify }}
        run: python -m modaradar --test-notify

      - name: Vigilar tiendas
        if: ${{ !inputs.test_notify }}
        run: python -m modaradar ${{ github.event_name == 'schedule' && '--min-gap 12' || '' }}

      - name: Guardar estado
        id: save
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name  "modaradar-bot"
          git config user.email "modaradar-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "datos: $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && break
              sleep $((i * 5))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar web
        if: ${{ steps.save.outputs.changed == 'true' || github.event_name != 'schedule' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar en GitHub Pages
        id: deploy
        if: ${{ steps.save.outputs.changed == 'true' || github.event_name != 'schedule' }}
        uses: actions/deploy-pages@v4
